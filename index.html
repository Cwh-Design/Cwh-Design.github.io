<script>

const navConfig = {
    intro:{ normal:"assets/top.png", active:"assets/top-active.png" },
    visual:{ normal:"assets/b.png", active:"assets/b-active.png" },
    c:{ normal:"assets/c.png", active:"assets/c-active.png" },
    b:{ normal:"assets/visual.png", active:"assets/visual-active.png" },
    top:{ normal:"assets/intro.png", active:"assets/intro-active.png" }
};

const navItems = document.querySelectorAll(".nav-item");

let lockedActive = null;

function clearActive(){
    navItems.forEach(item=>{
        const target = item.dataset.target;
        const img = item.querySelector("img");

        img.src = navConfig[target].normal;
        img.style.filter = "none";
    });
}

function setActive(id){
    navItems.forEach(item=>{
        const target = item.dataset.target;
        const img = item.querySelector("img");

        if(target === id){
            img.src = navConfig[target].active;
            img.style.filter =
                "drop-shadow(0 5px 20px rgba(54,138,255,.85))";
        }else{
            img.src = navConfig[target].normal;
            img.style.filter = "none";
        }
    });
}

navItems.forEach(item=>{

    item.addEventListener("mouseenter",()=>{
        const target = item.dataset.target;
        setActive(target);
    });

    item.addEventListener("mouseleave",()=>{
        if(lockedActive){
            setActive(lockedActive);
        }else{
            clearActive();
        }
    });

    item.addEventListener("click",()=>{
        const target = item.dataset.target;
        lockedActive = target;
        setActive(target);
    });

});

clearActive();

</script>
